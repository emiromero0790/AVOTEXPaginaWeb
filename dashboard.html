<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - AvoTex</title>
    <link rel="icon" type="image/png" href="images/vex logo final2.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d3320 0%, #1B4332 35%, #2d6a4f 65%, #3e8b33 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Decorative blobs */
        body::before {
            content: '';
            position: fixed;
            top: -150px; left: -150px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(140,198,63,0.18) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px; right: -100px;
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(62,139,51,0.22) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Floating leaves */
        .leaf {
            position: fixed;
            opacity: 0.07;
            pointer-events: none;
            animation: floatLeaf 8s ease-in-out infinite;
        }
        .leaf svg { fill: #8CC63F; }
        .leaf:nth-child(1){ top:10%; left:5%; animation-delay:0s; transform: rotate(20deg) scale(1.5); }
        .leaf:nth-child(2){ top:60%; left:2%; animation-delay:2s; transform: rotate(-15deg) scale(1.2); }
        .leaf:nth-child(3){ top:20%; right:4%; animation-delay:1s; transform: rotate(45deg) scale(2); }
        .leaf:nth-child(4){ bottom:15%; right:6%; animation-delay:3s; transform: rotate(-30deg) scale(1.4); }
        .leaf:nth-child(5){ top:45%; left:50%; animation-delay:1.5s; transform: rotate(60deg) scale(1.1); }

        @keyframes floatLeaf {
            0%,100%{transform-origin:center; margin-top:0px;}
            50%{margin-top:-18px;}
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-area img {
            height: 80px;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-8px);}
        }

        .logo-area h1 {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 0.75rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .logo-area p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: rgba(255,255,255,0.65);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .tab-btn.active {
            background: #fff;
            color: #1B4332;
        }

        /* Card */
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.1);
        }

        .card-header {
            margin-bottom: 2rem;
        }

        .card-header .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: linear-gradient(135deg, #1B4332, #3e8b33);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .card-header .badge.admin-badge {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1B4332;
            margin-bottom: 0.3rem;
        }

        .card-header h2.admin-h2 { color: #7c3aed; }

        .card-header p {
            color: #6b7280;
            font-size: 0.88rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.7rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            color: #1f2937;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #3e8b33;
            box-shadow: 0 0 0 3px rgba(62,139,51,0.1);
        }

        .form-group input.admin-focus:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
        }

        .error-box {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            font-weight: 500;
            display: none;
            border-left: 3px solid #dc2626;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1B4332, #3e8b33);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: opacity 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-btn.admin-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
        }

        .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin{ to{transform:rotate(360deg)} }

        .divider { border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0; }

        .footer-link {
            text-align: center;
            font-size: 0.85rem;
            color: #6b7280;
        }
        .footer-link a { color: #3e8b33; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        .panel { display: none; }
        .panel.active { display: block; }

        @media(max-width:480px){
            .login-card{ padding: 2rem 1.25rem; }
        }
    </style>
</head>
<body>

    <!-- Decorative leaves -->
    <div class="leaf"><svg width="80" height="80" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="40" ry="25" transform="rotate(30 50 50)"/></svg></div>
    <div class="leaf"><svg width="60" height="60" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="40" ry="22" transform="rotate(-20 50 50)"/></svg></div>
    <div class="leaf"><svg width="100" height="100" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="45" ry="28" transform="rotate(50 50 50)"/></svg></div>
    <div class="leaf"><svg width="70" height="70" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="42" ry="24" transform="rotate(-40 50 50)"/></svg></div>
    <div class="leaf"><svg width="55" height="55" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="38" ry="20" transform="rotate(70 50 50)"/></svg></div>

    <div class="wrapper">
        <div class="logo-area">
            <img src="images/AvotexLogo.png" alt="AvoTex">
            <h1>AvoTex</h1>
            <p>Plataforma de gestión de huertas</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('agricultor')">🌿 Agricultor</button>
            <button class="tab-btn" onclick="switchTab('admin')">🛡️ Administrador</button>
        </div>

        <div class="login-card">

            <!-- ===== AGRICULTOR PANEL ===== -->
            <div id="panelAgricultor" class="panel active">
                <div class="card-header">
                    <div class="badge">🌱 Acceso Huertero</div>
                    <h2>Bienvenido de vuelta</h2>
                    <p>Ingresa para ver los reportes de tu huerta</p>
                </div>

                <div id="errAgri" class="error-box"></div>

                <div class="form-group">
                    <label>Correo electrónico</label>
                    <div class="input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="agriEmail" placeholder="tu@correo.com" autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="agriPass" placeholder="Tu contraseña" autocomplete="current-password">
                    </div>
                </div>

                <button class="login-btn" id="agriBtn" onclick="loginAgricultor()">
                    <span id="agriTxt">Entrar a mi huerta</span>
                    <div class="spinner" id="agriSpin"></div>
                </button>

                <hr class="divider">
                <div class="footer-link">¿No tienes cuenta? <a href="avotex.html#pricing">Selecciona un plan</a></div>
            </div>

            <!-- ===== ADMIN PANEL ===== -->
            <div id="panelAdmin" class="panel">
                <div class="card-header">
                    <div class="badge admin-badge">🛡️ Administrador AvoTex</div>
                    <h2 class="admin-h2">Acceso Restringido</h2>
                    <p>Solo personal autorizado de AvoTex</p>
                </div>

                <div id="errAdmin" class="error-box"></div>

                <div class="form-group">
                    <label>Correo administrador</label>
                    <div class="input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="adminEmail" placeholder="vexmxoficial@gmail.com" autocomplete="email" class="admin-focus">
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="current-password" class="admin-focus">
                    </div>
                </div>

                <button class="login-btn admin-btn" id="adminBtn" onclick="loginAdmin()">
                    <span id="adminTxt">Acceder al panel</span>
                    <div class="spinner" id="adminSpin"></div>
                </button>

                <hr class="divider">
                <div class="footer-link"><a href="avotex.html">← Volver a AvoTex</a></div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBsP6jZoV9J32NFU5O67on5bgUH2UVz664",
            authDomain: "avotex-7ba66.firebaseapp.com",
            projectId: "avotex-7ba66",
            storageBucket: "avotex-7ba66.firebasestorage.app",
            messagingSenderId: "25290185078",
            appId: "1:25290185078:web:9b693d666d9b7d594a8257"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window._auth = auth;
        window._signIn = signInWithEmailAndPassword;
    </script>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b,i)=>{
                b.classList.toggle('active', (i===0 && tab==='agricultor')||(i===1 && tab==='admin'));
            });
            document.getElementById('panelAgricultor').classList.toggle('active', tab==='agricultor');
            document.getElementById('panelAdmin').classList.toggle('active', tab==='admin');
        }

        function setLoading(prefix, loading) {
            document.getElementById(prefix+'Btn').disabled = loading;
            document.getElementById(prefix+'Txt').style.display = loading ? 'none' : 'inline';
            document.getElementById(prefix+'Spin').style.display = loading ? 'block' : 'none';
        }

        function showError(elId, msg) {
            const el = document.getElementById(elId);
            el.textContent = msg;
            el.style.display = 'block';
        }

        function firebaseErrMsg(code) {
            if(code==='auth/user-not-found'||code==='auth/wrong-password'||code==='auth/invalid-credential') return 'Correo o contraseña incorrectos.';
            if(code==='auth/invalid-email') return 'El correo no es válido.';
            if(code==='auth/too-many-requests') return 'Demasiados intentos. Intenta más tarde.';
            return 'Error al iniciar sesión. Intenta de nuevo.';
        }

        async function loginAgricultor() {
            const email = document.getElementById('agriEmail').value.trim();
            const pass = document.getElementById('agriPass').value;
            document.getElementById('errAgri').style.display = 'none';

            if(!email||!pass){ showError('errAgri','Completa todos los campos.'); return; }
            setLoading('agri', true);
            try {
                await window._signIn(window._auth, email, pass);
                localStorage.setItem('avotex_email', email);
                localStorage.setItem('avotex_role', 'client');
                window.location.href = 'admin.html';
            } catch(e) {
                showError('errAgri', firebaseErrMsg(e.code));
            } finally { setLoading('agri', false); }
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value;
            document.getElementById('errAdmin').style.display = 'none';

            if(!email||!pass){ showError('errAdmin','Completa todos los campos.'); return; }
            if(email !== 'vexmxoficial@gmail.com'){
                showError('errAdmin','Acceso denegado. Solo administradores autorizados.');
                return;
            }
            setLoading('admin', true);
            try {
                await window._signIn(window._auth, email, pass);
                localStorage.setItem('avotex_email', email);
                localStorage.setItem('avotex_role', 'admin');
                window.location.href = 'avotex-admin.html';
            } catch(e) {
                showError('errAdmin', firebaseErrMsg(e.code));
            } finally { setLoading('admin', false); }
        }

        document.addEventListener('keydown', e => {
            if(e.key === 'Enter') {
                if(document.getElementById('panelAgricultor').classList.contains('active')) loginAgricultor();
                else loginAdmin();
            }
        });
    </script>
</body>
</html>
